<html lang="ja">

<title>StoneBlock — 地下採掘</title>
<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}

.brand{font-size:17px;font-weight:800;letter-spacing:.08em}.brand span{color:var(--accent)}.subtitle{color:var(--muted);font-size:11px}

main>section.panel{overflow:visible}

#world-stage{position:relative;width:10800px;height:10800px}
#world{position:sticky;top:0;left:0;display:block;width:100vw;height:100dvh;max-width:none;max-height:none;touch-action:pan-x pan-y;user-select:none;cursor:crosshair}

#map-panel{position:absolute;right:12px;bottom:12px;z-index:4;background:#101719d9;border:1px solid #3a4546;padding:5px;border-radius:3px}.map-title{font-size:10px;color:#aab5b1;letter-spacing:.12em;margin:0 0 4px 2px}#minimap{display:block;width:150px;height:150px;image-rendering:pixelated;cursor:pointer}@media(max-width:850px){#map-panel{right:7px;top:54px;bottom:auto;padding:3px}#minimap{width:104px;height:104px}}.legend{display:none}.modebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.modebtn.active{background:#394344;border-color:var(--accent);color:#e0e8e5}.modebtn.place.active{background:#294235;border-color:var(--good);color:#c9e6ce}
select,input[type=number]{background:#151c1e;color:var(--text);border:1px solid #3a4546;border-radius:3px;padding:6px;max-width:76px}
.side{position:absolute;right:12px;top:12px;width:220px;display:flex;flex-direction:column;gap:8px;z-index:4}.resource-list{display:grid;gap:2px;max-height:260px;overflow:auto}.resource{display:flex;align-items:center;gap:8px;padding:5px 6px;background:#202729;border-radius:2px;font-size:12px}.swatch{width:13px;height:13px;border-radius:1px;border:0;flex:none}.resource .name{flex:1}.resource .count{font-variant-numeric:tabular-nums;color:#c4ceca}
.inventory-tabs{display:flex;gap:4px;flex-wrap:wrap}.tab.active{background:#394344;border-color:var(--accent)}.inventory-view{display:none}.inventory-view.active{display:block}
.drawer{display:none;position:fixed;inset:0;background:#0009;z-index:10;justify-content:flex-end}.drawer.open{display:flex}.drawer-card{background:#1a2022;width:min(420px,92vw);height:100%;padding:16px;overflow:auto;border-left:1px solid #3a4546}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}

@media(max-width:850px){

<body>
<header><div><div class="brand"><span>STONE</span>BLOCK</div><div class="subtitle" id="tagline">石の世界を掘り進めよう</div></div><div class="mobile-resource"><span class="stat">所持 <b id="totalMobile">0</b></span><button id="openInventoryMobile">インベントリ</button></div><button id="languageToggle" aria-label="Switch language">English</button><div class="stats"><div class="stat"><span id="minedLabel">採掘数</span> <b id="mined">0</b></div><div class="stat"><span id="totalLabel">所持資源</span> <b id="total">0</b></div></div></header>
<main>
<section class="panel">
 <div class="panel-head"><div style="display:flex;align-items:center;gap:8px"><strong id="fieldTitle">地下フィールド</strong><button id="worldToggle" type="button">ライフワールドへ</button></div><div class="modebar"><button id="mineToggle" class="modebtn active">⛏ 採掘 ON</button></div></div>
 <div class="panel-body" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
  <div class="subtitle" id="hint">空気に接しているブロックをタップして1マス採掘</div>
  <div class="modebar"><label for="seedInput" class="subtitle" id="seedLabel">SEED</label><input id="seedInput" type="number" step="1" inputmode="numeric" placeholder="シード値" style="width:116px;max-width:116px"><button id="randomWorld">ランダム生成</button><button id="applySeed">指定シードで生成</button></div>
 </div>
 <div class="world-wrap"><div id="world-stage"><canvas id="world" aria-label="採掘フィールド"></canvas></div></div><div id="map-panel"><div class="map-title" id="mapTitle">マップ</div><canvas id="minimap" width="150" height="150" aria-label="全体マップ"></canvas></div>

</section>
<aside class="side">
 <section class="panel"><div class="panel-head"><strong id="resourcesTitle">資源一覧</strong><button id="openInventory">インベントリを開く</button></div><div class="panel-body"><div class="resource-list" id="quickResources"></div><div class="footer-note">左右の矢印で資源リストを切り替えできます。</div><div class="modebar" style="margin-top:10px;justify-content:space-between"><button id="prevPage">← 前へ</button><span id="pageLabel" class="subtitle">1 / 3</span><button id="nextPage">次へ →</button></div></div></section>
 <section class="panel"><div class="panel-head"><strong id="howTitle">遊び方</strong></div><div class="panel-body"><ol style="padding-left:19px;margin:0;color:var(--muted)"><li>空洞に接しているブロックをタップすると、その1マスだけ採掘。</li><li>採掘ONならタップした1マスだけ回収。</li><li>設置OFFなら選択した資源を1マスずつ配置。</li><li>掘るほど新しい資源層に到達します。</li></ol></div></section>
</aside>
</main>
<div class="drawer" id="drawer"><div class="drawer-card"><div class="drawer-head"><strong id="inventoryTitle" style="font-size:18px">インベントリ</strong><button id="closeInventory">閉じる ✕</button></div><div class="inventory-tabs" id="tabs"><button class="tab active" data-tab="all">すべて</button><button class="tab" data-tab="terrain">地層</button><button class="tab" data-tab="rock">岩石</button><button class="tab" data-tab="metal">金属</button><button class="tab" data-tab="gem">宝石</button><button class="tab" data-tab="nature">自然</button><button class="tab" data-tab="building">建築</button></div><div class="panel-body" style="padding:12px 0"><div class="resource-list" id="inventoryResources"></div><div class="footer-note">設置モードでは、ここで選択したブロックをフィールドに配置できます。</div></div></div></div>
<div class="toast" id="toast"></div>
<script>
(() => {
"use strict";
const TYPES = [

{id:"copper",name:"銅鉱石",nameEn:"Copper Ore",group:"metal",color:"#bd754b",symbol:"◆",weight:7},

{id:"diamond",name:"ダイヤモンド",nameEn:"Diamond",group:"gem",color:"#68e3e5",symbol:"✦",weight:.45},
{id:"ruby",name:"ルビー",nameEn:"Ruby",group:"gem",color:"#e34d64",symbol:"✦",weight:.6},
{id:"emerald",name:"エメラルド",nameEn:"Emerald",group:"gem",color:"#42c783",symbol:"✦",weight:.6},
{id:"amethyst",name:"アメジスト",nameEn:"Amethyst",group:"gem",color:"#a77ae8",symbol:"✦",weight:.7},
{id:"sapphire",name:"サファイア",nameEn:"Sapphire",group:"gem",color:"#4f83e8",symbol:"✦",weight:.6},
{id:"topaz",name:"トパーズ",nameEn:"Topaz",group:"gem",color:"#e9ae49",symbol:"✦",weight:.7},
{id:"aquamarine",name:"アクアマリン",nameEn:"Aquamarine",group:"gem",color:"#69c9d8",symbol:"✦",weight:.7},
{id:"grass_block",name:"草ブロック",nameEn:"Grass Block",group:"nature",color:"#65a94b",symbol:"▪",weight:0},
{id:"water",name:"水",nameEn:"Water",group:"nature",color:"#4baddb",symbol:"≈",weight:0},
{id:"flower",name:"花",nameEn:"Flower",group:"nature",color:"#e58baf",symbol:"✿",weight:0},
{id:"tall_grass",name:"草むら",nameEn:"Tall Grass",group:"nature",color:"#6fba58",symbol:"♣",weight:0},
{id:"leaves",name:"葉ブロック",nameEn:"Leaves",group:"nature",color:"#397b45",symbol:"♣",weight:0},
{id:"wood",name:"木材",nameEn:"Wood",group:"nature",color:"#93623b",symbol:"▥",weight:0},
{id:"conveyor",name:"コンベア",nameEn:"Conveyor",group:"building",color:"#a6a99e",symbol:"→",weight:0},
{id:"miner",name:"採掘機",nameEn:"Miner",group:"building",color:"#c18b45",symbol:"⚒",weight:0},
{id:"furnace",name:"かまど",nameEn:"Furnace",group:"building",color:"#b95e43",symbol:"▣",weight:0},
{id:"storage",name:"倉庫",nameEn:"Storage",group:"building",color:"#9a754d",symbol:"▤",weight:0},
{id:"road",name:"道路",nameEn:"Road",group:"building",color:"#777b78",symbol:"━",weight:0},
{id:"brick",name:"レンガ",nameEn:"Brick",group:"building",color:"#ad654e",symbol:"▦",weight:0},
{id:"stone_brick",name:"石レンガ",nameEn:"Stone Brick",group:"building",color:"#92958f",symbol:"▦",weight:0},
{id:"house",name:"住宅",nameEn:"House",group:"building",color:"#d2a66b",symbol:"⌂",weight:0},
{id:"farm",name:"畑",nameEn:"Farm",group:"building",color:"#8b9e48",symbol:"▦",weight:0},
{id:"iron_ingot",name:"鉄インゴット",nameEn:"Iron Ingot",group:"metal",color:"#d1c5b4",symbol:"■",weight:0},
{id:"copper_ingot",name:"銅インゴット",nameEn:"Copper Ingot",group:"metal",color:"#d78b5c",symbol:"■",weight:0}
];
const W=300,H=300,EMPTY=null;
let world=[],baseWorld=[],inventory={},mode="mine",selected="dirt",mined=0,page=0,invTab="all",visibility=[],activeWorld="underworld";
let language=localStorage.getItem("stoneblock-language")==="en"?"en":"ja";
const REVEAL_RADIUS=5;
const LIFE_SURFACE_Y=116;
const BUILD_COST={conveyor:{stone:1},miner:{iron:5,stone:8},furnace:{stone:8,coal:2},storage:{wood:8},road:{stone:1},brick:{clay:2,coal:1},stone_brick:{stone:2},house:{wood:12,stone:4},farm:{wood:3,stone:2}};
function updateVisibility(){
 visibility=Array.from({length:H},()=>Array(W).fill(99));
 const queue=new Int32Array(W*H),dist=new Int8Array(W*H);dist.fill(99);let head=0,tail=0;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(world[y][x]===EMPTY){const i=y*W+x;dist[i]=0;queue[tail++]=i;}
 while(head<tail){const i=queue[head++],x=i%W,y=(i/W)|0,d=dist[i];if(d>=REVEAL_RADIUS)continue;
  for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]])if(nx>=0&&ny>=0&&nx<W&&ny<H){const ni=ny*W+nx;if(dist[ni]>d+1){dist[ni]=d+1;queue[tail++]=ni;}}
 }
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)visibility[y][x]=dist[y*W+x];
}
const $=id=>document.getElementById(id);
const TEXT={
 ja:{tagline:"石の世界を掘り進めよう",underworld:"アンダーワールド",life:"ライフワールド",toLife:"ライフワールドへ",toUnderworld:"アンダーワールドへ",inventory:"インベントリ",mined:"採掘数",total:"所持資源",field:"地下フィールド",mine:"⛏ 採掘 ON",place:"▦ 採掘 OFF（設置）",hintMine:"空気に接しているブロックをタップして1マス採掘",hintPlace:"採掘OFF：インベントリからブロックを選び、空気マスをタップして1マス設置",seed:"SEED",random:"ランダム生成",apply:"指定シードで生成",map:"マップ",resources:"資源一覧",openInventory:"インベントリを開く",prev:"← 前へ",next:"次へ →",how:"遊び方",tabs:["すべて","地層","岩石","金属","宝石","自然","建築"],close:"閉じる ✕",footer:"設置モードでは、ここで選択したブロックをフィールドに配置できます。",instructions:["空洞に接しているブロックをタップすると、その1マスだけ採掘。","採掘ONならタップした1マスだけ回収。","設置OFFなら選択した資源を1マスずつ配置。","掘るほど新しい資源層に到達します。"]},
 en:{tagline:"Dig your way through the stone world",underworld:"Underworld",life:"Life World",toLife:"Go to Life World",toUnderworld:"Go to Underworld",inventory:"Inventory",mined:"Blocks mined",total:"Resources",field:"Underground",mine:"⛏ Mining ON",place:"▦ Mining OFF (Place)",hintMine:"Tap a block exposed to air to mine one tile",hintPlace:"Mining OFF: choose a block in Inventory, then tap an empty tile to place one",seed:"SEED",random:"Generate random",apply:"Generate from seed",map:"Map",resources:"Resources",openInventory:"Open inventory",prev:"← Previous",next:"Next →",how:"How to play",tabs:["All","Terrain","Rocks","Metals","Gems","Nature","Buildings"],close:"Close ✕",footer:"In placement mode, choose a block here and place it in the field.",instructions:["Tap a block touching an air space to mine that single tile.","When Mining is ON, only the tapped tile is collected.","When Mining is OFF, place the selected resource one tile at a time.","Dig deeper to discover new resource layers."]}
};
function applyLanguage(){
 const t=TEXT[language],en=language==="en";
 document.documentElement.lang=language;
 $("languageToggle").textContent=en?"日本語":"English";
 $("tagline").textContent=t.tagline;$("minedLabel").textContent=t.mined;$("totalLabel").textContent=t.total;
 $("fieldTitle").textContent=activeWorld==="underworld"?t.underworld:t.life;$("worldToggle").textContent=activeWorld==="underworld"?t.toLife:t.toUnderworld;$("seedLabel").textContent=t.seed;$("randomWorld").textContent=t.random;$("applySeed").textContent=t.apply;
 $("mapTitle").textContent=t.map;$("resourcesTitle").textContent=t.resources;$("openInventory").textContent=t.openInventory;
 $("howTitle").textContent=t.how;$("inventoryTitle").textContent=t.inventory;$("closeInventory").textContent=t.close;
 $("openInventoryMobile").textContent=t.inventory;$("prevPage").textContent=t.prev;$("nextPage").textContent=t.next;
 document.querySelectorAll(".tab").forEach((b,i)=>b.textContent=t.tabs[i]);
 document.querySelectorAll(".side .panel")[0].querySelector(".footer-note").textContent=en?"Use the arrows to switch resource pages.":"左右の矢印で資源リストを切り替えできます。";
 document.querySelectorAll(".side .panel")[1].querySelector("ol").innerHTML=t.instructions.map(x=>"<li>"+x+"</li>").join("");
 document.querySelector("#drawer .footer-note").textContent=t.footer;
 $("mineToggle").textContent=mode==="mine"?t.mine:t.place;
 $("hint").textContent=mode==="mine"?t.hintMine:t.hintPlace;
 renderResources();
}

const typeById=id=>TYPES.find(t=>t.id===id);
// Seeded 2D gradient Perlin noise and fractal Brownian motion.
let worldSeed=0;
const SAVE_KEY=()=>activeWorld==="underworld"?"stoneblock-world-v1":"stoneblock-life-world-v1";
const INVENTORY_KEY=()=>"stoneblock-inventory-v1";
function emptyWorld(){return Array.from({length:H},()=>Array(W).fill(EMPTY));}
function generateLifeBase(){
 const map=emptyWorld();
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const moisture=fbm(x*.035+71,y*.035-22,3),ore=fbm(x*.09-31,y*.09+88,3),forest=fbm(x*.055+113,y*.055+9,3);
  if(moisture>.58&&fbm(x*.07+8,y*.07-17,2)>.02)map[y][x]="water";
  else if(ore>.66&&forest<.25)map[y][x]=hash2(x+71,y-23)>.5?"iron":"coal";
  else if(ore<-.62&&forest<.25)map[y][x]=hash2(x-31,y+17)>.5?"stone":"copper";
  else if(forest>.48&&hash2(x+19,y+43)>.55)map[y][x]="wood";
  else if(moisture>.42&&fbm(x*.12+29,y*.12-61,2)>.22)map[y][x]="clay";
  else if(moisture>.42)map[y][x]="sand";
 }
 for(let y=H/2-8;y<=H/2+8;y++)for(let x=W/2-8;x<=W/2+8;x++)map[y][x]=EMPTY;
 return map;
}
function saveInventory(){try{localStorage.setItem(INVENTORY_KEY(),JSON.stringify(inventory));return true;}catch(e){toast("インベントリを保存できませんでした");return false;}}
function loadInventory(){try{const raw=localStorage.getItem(INVENTORY_KEY());const saved=raw?JSON.parse(raw):null;inventory={};for(const t of TYPES)inventory[t.id]=Number(saved?.[t.id])||0;}catch(e){inventory={};for(const t of TYPES)inventory[t.id]=0;}}
function saveWorld(show=true){try{const wrap=document.querySelector(".world-wrap"),changes=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(world[y][x]!==baseWorld[y][x])changes.push([i,world[y][x]]);}const data={version:4,seed:worldSeed,changes,mined,selected,mode,scrollLeft:wrap.scrollLeft,scrollTop:wrap.scrollTop};localStorage.setItem(SAVE_KEY(),JSON.stringify(data));if(show)toast("ワールドを保存しました（変更箇所 "+changes.length+"）");return true;}catch(e){toast("保存できませんでした（容量・ブラウザ設定を確認）");return false;}}
function loadWorld(show=true){try{
 const raw=localStorage.getItem(SAVE_KEY());if(!raw){if(show)toast("保存データがありません");return false;}
 const d=JSON.parse(raw);if(![1,2,3,4].includes(d.version))throw new Error("invalid save");
 worldSeed=Number.isSafeInteger(d.seed)?d.seed:0;baseWorld=activeWorld==="life"?generateLifeBase():generateBase();world=baseWorld.map(row=>row.slice());
 if(d.version===1){
  if(!Array.isArray(d.world)||d.world.length!==H||d.world.some(row=>!Array.isArray(row)||row.length!==W))throw new Error("invalid legacy save");
  world=d.world;
 }else{
  if(!Array.isArray(d.changes))throw new Error("invalid changes");
  for(const change of d.changes){if(!Array.isArray(change)||change.length!==2)continue;const i=change[0],id=change[1];if(!Number.isInteger(i)||i<0||i>=W*H||(id!==null&&!typeById(id)))continue;world[Math.floor(i/W)][i%W]=id;}
 }
 if(d.version<4&&!localStorage.getItem(INVENTORY_KEY())){inventory={};for(const t of TYPES)inventory[t.id]=Number(d.inventory?.[t.id])||0;saveInventory();}
 mined=Number(d.mined)||0;selected=typeById(d.selected)?d.selected:"dirt";mode=d.mode==="place"?"place":"mine";
 updateVisibility();setMode(mode);render();$("seedInput").value=String(worldSeed);
 const wrap=document.querySelector(".world-wrap");wrap.scrollLeft=Number(d.scrollLeft)||0;wrap.scrollTop=Number(d.scrollTop)||0;
 drawWorld();drawMinimap();if(show)toast("保存したワールドを読み込みました");return true;
 }catch(e){if(show)toast("保存データを読み込めませんでした");return false;}}
function hash2(ix,iy){
 let h=(Math.imul(ix,374761393)+Math.imul(iy,668265263)+worldSeed)|0;
 h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;
}
function fade(t){return t*t*t*(t*(t*6-15)+10);}
function perlin(x,y){
 const x0=Math.floor(x),y0=Math.floor(y),xf=x-x0,yf=y-y0;
 const dot=(ix,iy,dx,dy)=>{const a=hash2(ix,iy)*Math.PI*2;return Math.cos(a)*dx+Math.sin(a)*dy;};
 const u=fade(xf),v=fade(yf);
 const a=dot(x0,y0,xf,yf),b=dot(x0+1,y0,xf-1,yf);
 const c=dot(x0,y0+1,xf,yf-1),d=dot(x0+1,y0+1,xf-1,yf-1);
 const ab=a+(b-a)*u,cd=c+(d-c)*u;
 return (ab+(cd-ab)*v)*1.4142;
}
function fbm(x,y,octaves=4){
 let sum=0,amp=.5,freq=1,norm=0;
 for(let i=0;i<octaves;i++){sum+=perlin(x*freq,y*freq)*amp;norm+=amp;amp*=.5;freq*=2;}
 return sum/norm;
}
function weightedType(depth,x,y){
 const broad=fbm(x*.018,y*.018,3),medium=fbm(x*.055+41,y*.055-17,3);
 const detail=fbm(x*.13-9,y*.13+23,2),vertical=y/H;
 if(y<18+Math.floor((fbm(x*.035,7)*.5+.5)*8)){
  if(medium>.30&&detail>.00)return "clay";
  if(medium<-.34&&detail<-.00)return "sand";
  return "dirt";
 }
 // Carve connected cave systems before placing mineral deposits.
 const caveWarpX=fbm(x*.022+137,y*.022-51,3),caveWarpY=fbm(x*.022-73,y*.022+119,3);
 const cave=fbm((x+caveWarpX*8)*.042,(y+caveWarpY*8)*.042,3);
 if(y>28&&cave>.64&&detail<.58)return EMPTY;
 // Separate low-frequency fields make deposits form connected, irregular veins.
 const peatVein=fbm(x*.065+271,y*.065-143,3);
 const coalVein=fbm(x*.082-193,y*.082+101,3);
 const copperVein=fbm(x*.072+83,y*.072-29,3);
 const ironVein=fbm(x*.078-151,y*.078+67,3);
 const preciousVein=fbm(x*.105+211,y*.105-173,3);
 const gemVein=fbm(x*.145-307,y*.145+229,3);
 const local=fbm(x*.19+17,y*.19-91,2);
 if(y>12&&y<42&&peatVein>.48&&local<.30)return "peat";
 if(y>28&&y<220&&coalVein<-.48&&local>-.30)return "coal";
 if(y>34&&copperVein>.43&&local>-.24)return "copper";
 if(y>42&&ironVein<-.43&&local<.25)return "iron";
 if(vertical>.25&&preciousVein>.57&&local>-.08)return "gold";
 if(vertical>.30&&preciousVein<-.61&&local<.12)return "silver";
 if(vertical>.52&&broad<-.35&&preciousVein>.35&&local>.08)return "platinum";
 if(vertical>.38&&gemVein>.64&&local>.12){
  const gems=["diamond","ruby","emerald","amethyst","sapphire","topaz","aquamarine"];
  return gems[Math.floor(hash2(x+991,y-337)*gems.length)];
 }
 // Rock strata are broad regions; stone remains the dominant host rock.
 if(broad>.48&&medium>.05)return "granite";
 if(broad<-.48&&medium<-.02)return "basalt";
 if(medium>.48)return "diorite";
 if(medium<-.48)return "andesite";
 return "stone";
}
function generateBase(){
 const cx=Math.floor(W/2),cy=Math.floor(H/2);
 const map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>weightedType(Math.max(Math.abs(x-cx),Math.abs(y-cy)),x,y)));
 for(let y=cy-2;y<=cy+2;y++)for(let x=cx-2;x<=cx+2;x++)map[y][x]=EMPTY;
 return map;
}
function generate(seed=null){
 worldSeed=seed===null?Math.floor(Math.random()*2147483647):seed;
 baseWorld=generateBase();world=baseWorld.map(row=>row.slice());
 mined=0;updateVisibility();render();
 $("seedInput").value=String(worldSeed);
}
function isAir(x,y){return x<0||y<0||x>=W||y>=H||world[y][x]===EMPTY;}
function adjacentToSolid(x,y){return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>x+dx>=0&&y+dy>=0&&x+dx<W&&y+dy<H&&world[y+dy][x+dx]!==EMPTY);}
function exposed(x,y){if(isAir(x,y))return false;return isAir(x+1,y)||isAir(x-1,y)||isAir(x,y+1)||isAir(x,y-1);}
function drawLifeBackdrop(ctx,sx,sy,vw,vh,cell){
 ctx.fillStyle="#75b94f";ctx.fillRect(0,0,vw,vh);
 // Broad, soft-edged grass variation instead of a checkerboard of different tiles.
 for(let py=0;py<vh;py+=8)for(let px=0;px<vw;px+=8){
  const nx=(sx+px)*.012,ny=(sy+py)*.012,n=fbm(nx+43,ny-17,3);
  if(n>.18){ctx.fillStyle="rgba(43,105,47,"+Math.min(.13,(n-.18)*.12)+")";ctx.fillRect(px,py,8,8);}
  else if(n<-.18){ctx.fillStyle="rgba(183,190,104,"+Math.min(.10,(-n-.18)*.1)+")";ctx.fillRect(px,py,8,8);}
 }
 // Small grass tufts, spaced irregularly across the landscape.
 const x0=Math.max(0,Math.floor(sx/cell)-1),y0=Math.max(0,Math.floor(sy/cell)-1);
 const x1=Math.min(W,Math.ceil((sx+vw)/cell)+1),y1=Math.min(H,Math.ceil((sy+vh)/cell)+1);
 for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
  const seed=hash2(x+401,y-119);
  if(seed>.80){
   const px=x*cell-sx+8+hash2(x+9,y+5)*18,py=y*cell-sy+9+hash2(x-7,y+13)*18;
   ctx.strokeStyle="rgba(48,119,52,.45)";ctx.lineWidth=1.4;ctx.beginPath();
   ctx.moveTo(px,py+4);ctx.lineTo(px-2,py-2);ctx.moveTo(px,py+4);ctx.lineTo(px+3,py-3);ctx.stroke();
  }
 }
}
function drawWorld(){
 const canvas=$("world"),wrap=document.querySelector(".world-wrap"),ctx=canvas.getContext("2d");
 const dpr=Math.min(window.devicePixelRatio||1,2),vw=wrap.clientWidth,vh=wrap.clientHeight;
 canvas.width=Math.floor(vw*dpr);canvas.height=Math.floor(vh*dpr);canvas.style.width=vw+"px";canvas.style.height=vh+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);
 const cell=36,sx=wrap.scrollLeft,sy=wrap.scrollTop;
 if(activeWorld==="life")drawLifeBackdrop(ctx,sx,sy,vw,vh,cell);else{ctx.fillStyle="#090d0e";ctx.fillRect(0,0,vw,vh);}
 const x0=Math.max(0,Math.floor(sx/cell)),y0=Math.max(0,Math.floor(sy/cell));
 const x1=Math.min(W,Math.ceil((sx+vw)/cell)),y1=Math.min(H,Math.ceil((sy+vh)/cell));
 for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
  const id=world[y][x],px=x*cell-sx,py=y*cell-sy,distance=visibility[y]?.[x]??99;
  if(id===EMPTY)continue;
  if(activeWorld==="underworld"&&distance>REVEAL_RADIUS)continue;
  const t=typeById(id),darkness=Math.max(0,Math.min(.96,(distance-1)/5));ctx.globalAlpha=1-darkness;
  if(activeWorld==="life"&&id==="water"){ctx.fillStyle="#4baddb";ctx.fillRect(px,py,cell,cell);ctx.fillStyle="#9adcf0";ctx.fillRect(px+5,py+7,cell*.45,3);}
  else if(activeWorld==="life"&&id==="wood"){ctx.fillStyle="#397b45";ctx.beginPath();ctx.arc(px+18,py+15,13,0,Math.PI*2);ctx.fill();ctx.fillStyle="#765034";ctx.fillRect(px+15,py+20,6,13);}
  else if(activeWorld==="life"&&id==="sand"){ctx.fillStyle="#d7bd75";ctx.fillRect(px,py,cell,cell);}
  else if(activeWorld==="life"&&(id==="iron"||id==="coal")){ctx.fillStyle="#9b8d76";ctx.fillRect(px+4,py+4,cell-8,cell-8);ctx.fillStyle=t.color;ctx.fillRect(px+10,py+10,7,7);ctx.fillRect(px+21,py+20,6,6);}
  else{ctx.fillStyle=t.color;ctx.fillRect(px,py,cell,cell);}
  if(activeWorld==="life"&&id==="brick"){
   ctx.fillStyle="#ad654e";ctx.fillRect(px,py,cell,cell);ctx.strokeStyle="#e2ad91";ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(px,py+12);ctx.lineTo(px+cell,py+12);ctx.moveTo(px,py+24);ctx.lineTo(px+cell,py+24);ctx.moveTo(px+18,py);ctx.lineTo(px+18,py+12);ctx.moveTo(px+9,py+12);ctx.lineTo(px+9,py+24);ctx.moveTo(px+27,py+12);ctx.lineTo(px+27,py+24);ctx.moveTo(px+18,py+24);ctx.lineTo(px+18,py+cell);ctx.stroke();
  }else if(activeWorld==="life"&&id==="stone_brick"){
   ctx.fillStyle="#92958f";ctx.fillRect(px,py,cell,cell);ctx.strokeStyle="#c8cbc3";ctx.lineWidth=1.5;ctx.strokeRect(px+1,py+1,cell-2,cell-2);ctx.beginPath();ctx.moveTo(px,py+18);ctx.lineTo(px+cell,py+18);ctx.moveTo(px+18,py);ctx.lineTo(px+18,py+18);ctx.moveTo(px+9,py+18);ctx.lineTo(px+9,py+cell);ctx.moveTo(px+27,py+18);ctx.lineTo(px+27,py+cell);ctx.stroke();
  }else if(activeWorld==="life"&&t.group==="building"){ctx.strokeStyle="#26302b";ctx.lineWidth=2;ctx.strokeRect(px+3,py+3,cell-6,cell-6);ctx.fillStyle="#1f2924";ctx.font="bold 19px system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t.symbol,px+18,py+18);}
  // Fine, irregular mineral/soil grain: subtle pixel clusters, no tile outlines.
  let seed=((x*374761393)^(y*668265263)^(id.length*2246822519))>>>0;
  const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
  for(let k=0;k<13;k++){
   const shade=rand()>.5?255:0,alpha=.035+rand()*.09;
   ctx.fillStyle=shade?"rgba(255,255,255,"+alpha+")":"rgba(0,0,0,"+alpha+")";
   const size=2+Math.floor(rand()*5);ctx.fillRect(px+Math.floor(rand()*(cell-size)),py+Math.floor(rand()*(cell-size)),size,size);
  }
  if(t.group==="metal"||t.group==="gem"){
   for(let k=0;k<5;k++){const ox=4+rand()*28,oy=4+rand()*28;ctx.fillStyle=t.color;ctx.globalAlpha=.65+rand()*.3;ctx.fillRect(px+ox,py+oy,2+rand()*4,2+rand()*4);}
   ctx.globalAlpha=1;
  }
  ctx.globalAlpha=1;
 }
}
function drawMinimap(){const c=$("minimap"),ctx=c.getContext("2d"),sx=c.width/W,sy=c.height/H;ctx.fillStyle="#090d0e";ctx.fillRect(0,0,c.width,c.height);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=visibility[y]?.[x]??99;if(d>REVEAL_RADIUS||world[y][x]===EMPTY)continue;ctx.globalAlpha=1-Math.max(0,(d-1)/5);ctx.fillStyle=typeById(world[y][x]).color;ctx.fillRect(x*sx,y*sy,Math.ceil(sx),Math.ceil(sy));}ctx.globalAlpha=1;const wrap=document.querySelector(".world-wrap"),cell=36;ctx.strokeStyle="#f0f3f2";ctx.lineWidth=1;ctx.strokeRect(wrap.scrollLeft/(W*cell)*c.width,wrap.scrollTop/(H*cell)*c.height,wrap.clientWidth/(W*cell)*c.width,wrap.clientHeight/(H*cell)*c.height);}
function render(){
 drawWorld();drawMinimap();
 $("mined").textContent=mined;const total=Object.values(inventory).reduce((a,b)=>a+b,0);$("total").textContent=total;$("totalMobile").textContent=total;
 renderResources();
}
function interact(x,y){
 if(activeWorld==="life"){
  const id=world[y][x];
  if(mode==="mine"){
   const drops={wood:"wood",iron:"iron",coal:"coal",stone:"stone",copper:"copper",clay:"clay"};
   if(id&&BUILD_COST[id]){
    for(const [item,count] of Object.entries(BUILD_COST[id]))inventory[item]=(inventory[item]||0)+count;
    world[y][x]=EMPTY;mined++;saveInventory();saveWorld(false);render();toast(typeById(id).name+"を撤去し、資材を回収しました");return;
   }
   if(!id||!drops[id]){toast("ここには採掘できる資源がありません");return;}
   inventory[drops[id]]=(inventory[drops[id]]||0)+1;world[y][x]=EMPTY;mined++;saveInventory();saveWorld(false);render();toast(typeById(drops[id]).name+"を1個回収");return;
  }
  if(id){toast("そこには配置できません");return;}
  const cost=BUILD_COST[selected];if(!cost){toast("建築物を選択してください");return;}
  const missing=Object.entries(cost).filter(([item,n])=>(inventory[item]||0)<n);
  if(missing.length){toast("資源不足："+missing.map(([item,n])=>typeById(item).name+" "+n).join(" / "));return;}
  for(const [item,n] of Object.entries(cost))inventory[item]-=n;
  world[y][x]=selected;saveInventory();saveWorld(false);render();toast(typeById(selected).name+"を建設しました");return;
 }
 if(mode==="mine"){
  const id=world[y][x];if(id===EMPTY)return;
  if(!exposed(x,y)){toast("このブロックはまだ空気に接していません");return;}
  world[y][x]=EMPTY;inventory[id]=(inventory[id]||0)+1;mined++;updateVisibility();
  render();saveInventory();saveWorld(false);toast("1マス採掘しました");
 }else{
  if(!isAir(x,y)){toast("空いているマスを選んでください");return;}
  const id=selected,t=typeById(id);
  if(inventory[id]<1){toast(t.name+"が足りません（所持 0 個）");return;}
  world[y][x]=id;inventory[id]--;updateVisibility();render();saveInventory();saveWorld(false);toast(t.name+"を1マス設置しました");
 }
}
function simulateLifeWorld(){
 if(activeWorld!=="life")return;
 let changed=false;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const id=world[y][x];
  if(id==="miner"){
   for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    const nx=x+dx,ny=y+dy;
    if(nx<0||ny<0||nx>=W||ny>=H)continue;
    const ore=world[ny][nx];
    if(ore==="iron"||ore==="coal"||ore==="copper"||ore==="stone"){world[ny][nx]=EMPTY;inventory[ore]=(inventory[ore]||0)+1;changed=true;break;}
   }
  }else if(id==="furnace"&&(inventory.iron||0)>0&&(inventory.coal||0)>0){
   inventory.iron--;inventory.coal--;inventory.iron_ingot=(inventory.iron_ingot||0)+1;changed=true;
  }else if(id==="furnace"&&(inventory.copper||0)>0&&(inventory.coal||0)>0){
   inventory.copper--;inventory.coal--;inventory.copper_ingot=(inventory.copper_ingot||0)+1;changed=true;
  }
 }
 if(changed){saveInventory();saveWorld(false);render();toast("工場が資源を生産しました");}
}
setInterval(simulateLifeWorld,5000);
function maxBuildable(id){
 const cost=BUILD_COST[id];if(!cost)return 0;
 return Math.min(...Object.entries(cost).map(([item,count])=>Math.floor((inventory[item]||0)/count)));
}
function resourceRow(t){
 const row=document.createElement("div");row.className="resource";
 const swatch=document.createElement("span");swatch.className="swatch";swatch.style.background=t.color;
 const name=document.createElement("span");name.className="name";name.textContent=language==="en"?(t.nameEn||t.name):t.name;
 const count=document.createElement("b");count.className="count";count.textContent=activeWorld==="life"&&t.group==="building"?"最大 "+maxBuildable(t.id):String(inventory[t.id]||0);
 row.append(swatch,name,count);
 row.addEventListener("click",()=>{selected=t.id;document.querySelectorAll(".resource").forEach(e=>e.style.outline="");row.style.outline="1px solid #a6b5b2";$("hint").textContent=(language==="en"?"Selected: ":"選択中：")+name.textContent;saveWorld(false);});
 return row;
}
function renderResources(){
 const start=page*7,items=TYPES.slice(start,start+7);$("quickResources").innerHTML="";items.forEach(t=>$("quickResources").appendChild(resourceRow(t)));
 $("pageLabel").textContent=(page+1)+" / "+Math.ceil(TYPES.length/7);
 $("prevPage").disabled=page===0;$("nextPage").disabled=(page+1)*7>=TYPES.length;
 $("inventoryResources").innerHTML="";
 TYPES.filter(t=>invTab==="all"||t.group===invTab).forEach(t=>$("inventoryResources").appendChild(resourceRow(t)));
}
function setMode(next){
 mode=next;const toggle=$("mineToggle");toggle.textContent=mode==="mine"?"⛏ 採掘 ON":"▦ 採掘 OFF（設置）";toggle.classList.toggle("active",mode==="mine");toggle.classList.toggle("place",mode==="place");
 $("hint").textContent=mode==="mine"?TEXT[language].hintMine:TEXT[language].hintPlace;$("mineToggle").textContent=mode==="mine"?TEXT[language].mine:TEXT[language].place;render();
}
function toast(s){const e=$("toast");e.textContent=s;e.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove("show"),1700);}
$("mineToggle").onclick=()=>{setMode(mode==="mine"?"place":"mine");saveWorld(false);};
$("worldToggle").onclick=()=>{saveWorld(false);saveInventory();const wrap=document.querySelector(".world-wrap");activeWorld=activeWorld==="underworld"?"life":"underworld";loadInventory();const loaded=loadWorld(false);if(!loaded){if(activeWorld==="life"){worldSeed=0;baseWorld=generateLifeBase();world=baseWorld.map(row=>row.slice());mined=0;selected="conveyor";setMode("place");}else{generate();setMode("mine");}wrap.scrollLeft=(wrap.scrollWidth-wrap.clientWidth)/2;wrap.scrollTop=(wrap.scrollHeight-wrap.clientHeight)/2;saveWorld(false);}applyLanguage();render();toast(activeWorld==="life"?"ライフワールドに移動しました":"アンダーワールドに移動しました");};
$("languageToggle").onclick=()=>{language=language==="ja"?"en":"ja";localStorage.setItem("stoneblock-language",language);applyLanguage();};
$("prevPage").onclick=()=>{page=Math.max(0,page-1);renderResources();};$("nextPage").onclick=()=>{page=Math.min(Math.ceil(TYPES.length/7)-1,page+1);renderResources();};
$("openInventory").onclick=$("openInventoryMobile").onclick=()=>{$("drawer").classList.add("open");};
$("closeInventory").onclick=()=> $("drawer").classList.remove("open");
$("drawer").addEventListener("click",e=>{if(e.target===$("drawer"))$("drawer").classList.remove("open");});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;invTab=b.dataset.tab;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));renderResources();});
$("randomWorld").onclick=()=>{if(activeWorld==="life"){toast("ライフワールドの地形は固定です");return;}if(confirm("ランダムなシード値で新しい地形を生成しますか？インベントリは保持されます。")){generate();saveWorld(false);saveInventory();toast("新しいワールド：seed "+worldSeed);}};
$("applySeed").onclick=()=>{if(activeWorld==="life"){toast("ライフワールドの地形は固定です");return;}const raw=$("seedInput").value.trim(),seed=Number(raw);if(raw===""||!Number.isSafeInteger(seed)){toast("シード値は整数で入力してください");return;}if(confirm("シード "+seed+" で新しい地形を生成しますか？インベントリは保持されます。")){generate(seed);saveWorld(false);saveInventory();toast("指定シードで生成しました："+worldSeed);}};
loadInventory();
 const hasSavedWorld=loadWorld(false);if(!hasSavedWorld){if(activeWorld==="life"){worldSeed=0;baseWorld=generateLifeBase();world=baseWorld.map(row=>row.slice());mined=0;mode="place";selected="conveyor";updateVisibility();setMode("place");}else{generate();}saveWorld(false);}
 const wrap=document.querySelector(".world-wrap");
 if(!hasSavedWorld){wrap.scrollLeft=(wrap.scrollWidth-wrap.clientWidth)/2;wrap.scrollTop=(wrap.scrollHeight-wrap.clientHeight)/2;}
 let saveScrollTimer;wrap.addEventListener("scroll",()=>{drawWorld();drawMinimap();clearTimeout(saveScrollTimer);saveScrollTimer=setTimeout(()=>saveWorld(false),500);},{passive:true});
 $("minimap").addEventListener("click",e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W*36,y=(e.clientY-r.top)/r.height*H*36;wrap.scrollLeft=Math.max(0,x-wrap.clientWidth/2);wrap.scrollTop=Math.max(0,y-wrap.clientHeight/2);drawWorld();drawMinimap();});
 $("world").addEventListener("click",e=>{
  if(e.target!==$("world"))return;
  const rect=wrap.getBoundingClientRect(),x=Math.floor((e.clientX-rect.left+wrap.scrollLeft)/36),y=Math.floor((e.clientY-rect.top+wrap.scrollTop)/36);
  if(x>=0&&y>=0&&x<W&&y<H){if(activeWorld==="life")interact(x,y);else if(mode==="mine"){if(exposed(x,y))interact(x,y);}else if(isAir(x,y))interact(x,y);}
 });
 window.addEventListener("resize",drawWorld);window.addEventListener("pagehide",()=>saveWorld(false));applyLanguage();drawWorld();
})();
