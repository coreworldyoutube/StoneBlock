<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>StoneBlock — 地下採掘</title>
<style>
:root{color-scheme:dark;--bg:#101315;--panel:#1a2022;--panel2:#252d2f;--line:#343d3f;--text:#e4e9e7;--muted:#929e99;--accent:#a6b5b2;--good:#8fba9a}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer;color:inherit;background:#252d2f;border:1px solid #3a4546;border-radius:4px;padding:7px 10px}button:hover{background:#303a3b;border-color:#687675}button:disabled{opacity:.35;cursor:not-allowed}
header{height:54px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;border-bottom:1px solid #30393a;background:#171d1f;position:relative;z-index:5}
.brand{font-size:17px;font-weight:800;letter-spacing:.08em}.brand span{color:var(--accent)}.subtitle{color:var(--muted);font-size:11px}
main{height:calc(100dvh - 54px);width:100%;margin:0;padding:0;display:block;position:relative}
.panel{background:#1a2022;border:1px solid #303a3b;border-radius:5px;box-shadow:none;overflow:hidden}.panel-head{padding:9px 11px;border-bottom:1px solid #303a3b;display:flex;justify-content:space-between;align-items:center;gap:8px}.panel-body{padding:10px}
.stats{display:flex;gap:6px}.stat{background:#202729;border:1px solid #333e40;padding:5px 9px;border-radius:3px;color:var(--muted);font-size:11px}.stat b{color:var(--text);margin-left:4px}
main>section{height:100%;border:0!important;border-radius:0!important;background:transparent!important}
main>section>.panel-head{position:absolute;top:12px;left:14px;z-index:3;border:0;background:#171d1fdc;border-radius:4px;padding:7px 9px}
main>section>.panel-body{position:absolute;top:12px;right:248px;z-index:3;padding:0;background:#171d1fdc;border-radius:4px}
main>section>.panel-body .subtitle{display:none}
.world-wrap{height:100%;width:100%;overflow:hidden;background:#101516;padding:0;display:flex;justify-content:center;align-items:center}
#world{display:grid;gap:1px;user-select:none;touch-action:manipulation;width:min(calc(100vw - 280px),calc(100dvh - 86px));height:min(calc(100vw - 280px),calc(100dvh - 86px));grid-template-columns:repeat(19,minmax(0,1fr));grid-template-rows:repeat(19,minmax(0,1fr));background:#0d1112}
.tile{width:100%;height:100%;min-width:0;min-height:0;padding:0;border:0;border-radius:0;position:relative;display:block;box-shadow:none;transition:filter .1s}
.tile:hover{filter:brightness(1.14);transform:none;z-index:1}.tile.air{background:#11191a;border:0;box-shadow:none;cursor:default}.tile.air.placeable{cursor:crosshair;outline:1px solid #9bc9a5;outline-offset:-1px}.tile.locked{cursor:not-allowed;filter:brightness(.72)}.tile.reachable{outline:1px solid #a6b5b2;outline-offset:-1px}
.legend{display:none}.modebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.modebtn.active{background:#394344;border-color:var(--accent);color:#e0e8e5}.modebtn.place.active{background:#294235;border-color:var(--good);color:#c9e6ce}
select,input[type=number]{background:#151c1e;color:var(--text);border:1px solid #3a4546;border-radius:3px;padding:6px;max-width:76px}
.side{position:absolute;right:12px;top:12px;width:220px;display:flex;flex-direction:column;gap:8px;z-index:4}.resource-list{display:grid;gap:2px;max-height:260px;overflow:auto}.resource{display:flex;align-items:center;gap:8px;padding:5px 6px;background:#202729;border-radius:2px;font-size:12px}.swatch{width:13px;height:13px;border-radius:1px;border:0;flex:none}.resource .name{flex:1}.resource .count{font-variant-numeric:tabular-nums;color:#c4ceca}
.inventory-tabs{display:flex;gap:4px;flex-wrap:wrap}.tab.active{background:#394344;border-color:var(--accent)}.inventory-view{display:none}.inventory-view.active{display:block}
.drawer{display:none;position:fixed;inset:0;background:#0009;z-index:10;justify-content:flex-end}.drawer.open{display:flex}.drawer-card{background:#1a2022;width:min(420px,92vw);height:100%;padding:16px;overflow:auto;border-left:1px solid #3a4546}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.footer-note{color:var(--muted);font-size:11px;margin-top:8px}.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#252e30;border:1px solid #566363;padding:8px 13px;border-radius:4px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}.toast.show{opacity:1}
.mobile-resource{display:none}
@media(max-width:850px){
 header{height:48px;padding:0 9px}.brand{font-size:15px}.subtitle{display:none}.stats .stat:first-child{display:none}
 main{height:calc(100dvh - 48px)}
 main>section>.panel-head{top:7px;left:7px;padding:5px 6px}
 main>section>.panel-body{top:auto;right:7px;bottom:7px;padding:0}
 main>section>.panel-body .modebar{gap:4px}
 #world{width:min(calc(100vw - 12px),calc(100dvh - 112px));height:min(calc(100vw - 12px),calc(100dvh - 112px))}
 .side{display:none}.mobile-resource{display:flex;gap:5px;align-items:center}.mobile-resource .stat{display:none}
}
</style>
</head>
<body>
<header><div><div class="brand"><span>STONE</span>BLOCK</div><div class="subtitle">石の世界を掘り進めよう</div></div><div class="mobile-resource"><span class="stat">所持 <b id="totalMobile">0</b></span><button id="openInventoryMobile">インベントリ</button></div><div class="stats"><div class="stat">採掘数 <b id="mined">0</b></div><div class="stat">所持資源 <b id="total">0</b></div></div></header>
<main>
<section class="panel">
 <div class="panel-head"><strong>地下フィールド</strong><div class="modebar"><button id="mineToggle" class="modebtn active">⛏ 採掘 ON</button></div></div>
 <div class="panel-body" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
  <div class="subtitle" id="hint">空気に接しているブロックをクリックして採掘</div>
  <div class="modebar"><label for="amount">設置数</label><input id="amount" type="number" min="1" max="999" value="1"><button id="reset">ワールド再生成</button></div>
 </div>
 <div class="world-wrap"><div id="world" aria-label="採掘フィールド"></div></div>

</section>
<aside class="side">
 <section class="panel"><div class="panel-head"><strong>資源一覧</strong><button id="openInventory">インベントリを開く</button></div><div class="panel-body"><div class="resource-list" id="quickResources"></div><div class="footer-note">左右の矢印で資源リストを切り替えできます。</div><div class="modebar" style="margin-top:10px;justify-content:space-between"><button id="prevPage">← 前へ</button><span id="pageLabel" class="subtitle">1 / 3</span><button id="nextPage">次へ →</button></div></div></section>
 <section class="panel"><div class="panel-head"><strong>遊び方</strong></div><div class="panel-body"><ol style="padding-left:19px;margin:0;color:var(--muted)"><li>空洞に接しているブロックをクリック。</li><li>採掘ONなら資源として回収。</li><li>設置OFFなら選択した資源を指定数だけ配置。</li><li>掘るほど新しい資源層に到達します。</li></ol></div></section>
</aside>
</main>
<div class="drawer" id="drawer"><div class="drawer-card"><div class="drawer-head"><strong style="font-size:18px">インベントリ</strong><button id="closeInventory">閉じる ✕</button></div><div class="inventory-tabs" id="tabs"><button class="tab active" data-tab="all">すべて</button><button class="tab" data-tab="terrain">地層</button><button class="tab" data-tab="rock">岩石</button><button class="tab" data-tab="metal">金属</button><button class="tab" data-tab="gem">宝石</button></div><div class="panel-body" style="padding:12px 0"><div class="resource-list" id="inventoryResources"></div><div class="footer-note">設置モードでは、ここで選択したブロックをフィールドに配置できます。</div></div></div></div>
<div class="toast" id="toast"></div>
<script>
(() => {
"use strict";
const TYPES = [
{id:"dirt",name:"土",group:"terrain",color:"#79543a",symbol:"▪",weight:28},
{id:"clay",name:"粘土",group:"terrain",color:"#a66f67",symbol:"▪",weight:12},
{id:"sand",name:"砂",group:"terrain",color:"#d7bd75",symbol:"▪",weight:15},
{id:"stone",name:"石",group:"rock",color:"#858b91",symbol:"▪",weight:35},
{id:"granite",name:"花崗岩",group:"rock",color:"#b47c76",symbol:"▪",weight:10},
{id:"andesite",name:"安山岩",group:"rock",color:"#777e82",symbol:"▪",weight:10},
{id:"basalt",name:"玄武岩",group:"rock",color:"#414a54",symbol:"▪",weight:9},
{id:"diorite",name:"閃緑岩",group:"rock",color:"#c0c4c1",symbol:"▪",weight:8},
{id:"copper",name:"銅鉱石",group:"metal",color:"#bd754b",symbol:"◆",weight:7},
{id:"iron",name:"鉄鉱石",group:"metal",color:"#b7a18b",symbol:"◆",weight:8},
{id:"gold",name:"金鉱石",group:"metal",color:"#e5bd42",symbol:"◆",weight:3},
{id:"silver",name:"銀鉱石",group:"metal",color:"#c5d1dc",symbol:"◆",weight:2},
{id:"platinum",name:"プラチナ鉱石",group:"metal",color:"#9fc5cf",symbol:"◆",weight:1},
{id:"diamond",name:"ダイヤモンド",group:"gem",color:"#68e3e5",symbol:"✦",weight:.45},
{id:"ruby",name:"ルビー",group:"gem",color:"#e34d64",symbol:"✦",weight:.6},
{id:"emerald",name:"エメラルド",group:"gem",color:"#42c783",symbol:"✦",weight:.6},
{id:"amethyst",name:"アメジスト",group:"gem",color:"#a77ae8",symbol:"✦",weight:.7},
{id:"sapphire",name:"サファイア",group:"gem",color:"#4f83e8",symbol:"✦",weight:.6},
{id:"topaz",name:"トパーズ",group:"gem",color:"#e9ae49",symbol:"✦",weight:.7},
{id:"aquamarine",name:"アクアマリン",group:"gem",color:"#69c9d8",symbol:"✦",weight:.7}
];
const W=19,H=19,EMPTY=null;
let world=[],inventory={},mode="mine",selected="dirt",mined=0,page=0,invTab="all";
const $=id=>document.getElementById(id);
const typeById=id=>TYPES.find(t=>t.id===id);
function weightedType(depth,x,y){
 const weights=TYPES.map(t=>{let w=t.weight;if(t.group==="gem")w*=Math.max(.12,Math.min(2.8,depth/45));if(t.id==="dirt"||t.id==="sand"||t.id==="clay")w*=Math.max(.08,1-depth/35);if(t.id==="basalt"||t.id==="granite"||t.id==="andesite"||t.id==="diorite")w*=1+depth/90;return w;});
 let n=Math.random()*weights.reduce((a,b)=>a+b,0);
 for(let i=0;i<TYPES.length;i++){n-=weights[i];if(n<=0)return TYPES[i].id;}
 return "stone";
}
function generate(){
 world=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>weightedType(Math.max(Math.abs(x-9),Math.abs(y-9)),x,y)));
 for(let y=7;y<=11;y++)for(let x=7;x<=11;x++)world[y][x]=EMPTY;
 inventory={};for(const t of TYPES)inventory[t.id]=0;
 mined=0;render();
}
function isAir(x,y){return x<0||y<0||x>=W||y>=H||world[y][x]===EMPTY;}
function adjacentToSolid(x,y){return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>x+dx>=0&&y+dy>=0&&x+dx<W&&y+dy<H&&world[y+dy][x+dx]!==EMPTY);}
function exposed(x,y){if(isAir(x,y))return false;return isAir(x+1,y)||isAir(x-1,y)||isAir(x,y+1)||isAir(x,y-1);}
function render(){
 const el=$("world");el.style.gridTemplateColumns=`repeat(${W},auto)`;el.innerHTML="";
 for(let y=0;y<H;y++)for(let x=0;x<W;x++){
  const id=world[y][x],b=document.createElement("button");b.className="tile";
  if(id===EMPTY){b.classList.add("air");const canPlace=mode==="place"&&adjacentToSolid(x,y);b.classList.toggle("placeable",canPlace);b.disabled=!canPlace;b.setAttribute("aria-label","空気（設置可能）");if(canPlace)b.addEventListener("click",()=>interact(x,y));}
  else{const t=typeById(id),ok=exposed(x,y);b.style.background=t.color;b.classList.toggle("reachable",ok);b.classList.toggle("locked",!ok);b.innerHTML="";b.title=t.name+(ok?" — 操作可能":" — 空気に接していません");b.setAttribute("aria-label",t.name);if(mode==="mine"&&ok)b.addEventListener("click",()=>interact(x,y));}
  el.appendChild(b);
 }
 $("mined").textContent=mined;const total=Object.values(inventory).reduce((a,b)=>a+b,0);$("total").textContent=total;$("totalMobile").textContent=total;
 renderResources();
}
function interact(x,y){
 if(mode==="mine"){
  if(!exposed(x,y)){toast("このブロックはまだ空気に接していません");return;}
  const id=world[y][x];world[y][x]=EMPTY;inventory[id]=(inventory[id]||0)+1;mined++;render();
 }else{
  if(!isAir(x,y)||!adjacentToSolid(x,y)){toast("ブロックに接している空気マスを選んでください");return;}
  const id=selected,t=typeById(id),n=Math.max(1,Math.min(999,Math.floor(Number($("amount").value)||1)));
  if(inventory[id]<n){toast(t.name+"が足りません（所持 "+inventory[id]+" 個）");return;}
  const queue=[[x,y]],seen=new Set(),placed=[];
  while(queue.length&&placed.length<n){const [cx,cy]=queue.shift(),key=cx+","+cy;if(seen.has(key))continue;seen.add(key);
   if(cx<0||cy<0||cx>=W||cy>=H||!isAir(cx,cy)||!adjacentToSolid(cx,cy))continue;
   world[cy][cx]=id;placed.push([cx,cy]);
   queue.push([cx+1,cy],[cx-1,cy],[cx,cy+1],[cx,cy-1]);
  }
  inventory[id]-=placed.length;render();toast(t.name+"を"+placed.length+"個設置しました");
 }
}
function resourceRow(t){
 const row=document.createElement("div");row.className="resource";row.innerHTML=`<span class="swatch" style="background:${t.color}"></span><span class="name">${t.name}</span><b class="count">${inventory[t.id]||0}</b>`;
 row.addEventListener("click",()=>{selected=t.id;document.querySelectorAll(".resource").forEach(e=>e.style.outline="");row.style.outline="1px solid #e2ad58";$("hint").textContent="設置対象："+t.name;});return row;
}
function renderResources(){
 const start=page*7,items=TYPES.slice(start,start+7);$("quickResources").innerHTML="";items.forEach(t=>$("quickResources").appendChild(resourceRow(t)));
 $("pageLabel").textContent=(page+1)+" / "+Math.ceil(TYPES.length/7);
 $("prevPage").disabled=page===0;$("nextPage").disabled=(page+1)*7>=TYPES.length;
 $("inventoryResources").innerHTML="";
 TYPES.filter(t=>invTab==="all"||t.group===invTab).forEach(t=>$("inventoryResources").appendChild(resourceRow(t)));
}
function setMode(next){
 mode=next;const toggle=$("mineToggle");toggle.textContent=mode==="mine"?"⛏ 採掘 ON":"▦ 採掘 OFF（設置）";toggle.classList.toggle("active",mode==="mine");toggle.classList.toggle("place",mode==="place");
 $("hint").textContent=mode==="mine"?"空気に接しているブロックをクリックして採掘":"採掘OFF：インベントリからブロックを選び、緑枠の空気マスをクリックして指定数を設置";render();
}
function toast(s){const e=$("toast");e.textContent=s;e.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove("show"),1700);}
$("mineToggle").onclick=()=>setMode(mode==="mine"?"place":"mine");
$("prevPage").onclick=()=>{page=Math.max(0,page-1);renderResources();};$("nextPage").onclick=()=>{page=Math.min(Math.ceil(TYPES.length/7)-1,page+1);renderResources();};
$("openInventory").onclick=$("openInventoryMobile").onclick=()=>{$("drawer").classList.add("open");};
$("closeInventory").onclick=()=> $("drawer").classList.remove("open");
$("drawer").addEventListener("click",e=>{if(e.target===$("drawer"))$("drawer").classList.remove("open");});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;invTab=b.dataset.tab;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));renderResources();});
$("reset").onclick=()=>{if(confirm("ワールドとインベントリを初期化しますか？"))generate();};
generate();
})();
</script>
</body>
</html>
