<style>

*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}

#map-panel{position:absolute;right:12px;bottom:12px;z-index:4;background:#101719d9;border:1px solid #3a4546;padding:5px;border-radius:3px}.map-title{font-size:10px;color:#aab5b1;letter-spacing:.12em;margin:0 0 4px 2px}#minimap{display:block;width:150px;height:150px;image-rendering:pixelated;cursor:pointer}@media(max-width:850px){#map-panel{right:7px;top:54px;bottom:auto;padding:3px}#minimap{width:104px;height:104px}}.legend{display:none}.modebar{display:flex;gap:6px;align-items:center;flex-wrap:wrap}.modebtn.active{background:#394344;border-color:var(--accent);color:#e0e8e5}.modebtn.place.active{background:#294235;border-color:var(--good);color:#c9e6ce}

 header{height:48px;padding:0 9px}.brand{font-size:15px}.subtitle{display:none}.stats .stat:first-child{display:none}

<body>
<header><div><div class="brand"><span>STONE</span>BLOCK</div><div class="subtitle" id="brandSubtitle">石の世界を掘り進めよう</div></div><div class="mobile-resource"><span class="stat">所持 <b id="totalMobile">0</b></span><button id="openInventoryMobile">インベントリ</button></div><div class="stats"><div class="stat">採掘数 <b id="mined">0</b></div><div class="stat">所持資源 <b id="total">0</b></div></div></header>
<main>
<section class="panel">
 <div class="panel-head"><strong id="fieldTitle">地下フィールド</strong><div class="modebar"><button id="mineToggle" class="modebtn active">⛏ 採掘 ON</button><button id="buildConveyor">コンベアを作る</button><button id="buildFurnace">かまどを作る</button><button id="distribute">配る：OFF</button><label style="font-size:11px;color:#aab5b1">方向 <select id="beltDirection"><option value="right">→</option><option value="down">↓</option><option value="left">←</option><option value="up">↑</option></select></label><label style="font-size:11px;color:#aab5b1">言語 <select id="language"><option value="ja">日本語</option><option value="en">English</option></select></label></div></div>
 <div class="panel-body" style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap">
  <div class="subtitle" id="hint">空気に接しているブロックをタップして1マス採掘</div>
  <div class="modebar"><label for="seedInput" class="subtitle">SEED</label><input id="seedInput" type="number" step="1" inputmode="numeric" placeholder="シード値" style="width:116px;max-width:116px"><button id="randomWorld">ランダム生成</button><button id="applySeed">指定シードで生成</button></div>
 </div>
 <div class="world-wrap"><div id="world-stage"><canvas id="world" aria-label="採掘フィールド"></canvas></div></div><div id="map-panel"><div class="map-title">MAP</div><canvas id="minimap" width="150" height="150" aria-label="全体マップ"></canvas></div>

</section>
<aside class="side">
 <section class="panel"><div class="panel-head"><strong id="resourceTitle">資源一覧</strong><button id="openInventory">インベントリを開く</button></div><div class="panel-body"><div class="resource-list" id="quickResources"></div><div class="footer-note" id="quickNote">左右の矢印で資源リストを切り替えできます。</div><div class="modebar" style="margin-top:10px;justify-content:space-between"><button id="prevPage">← 前へ</button><span id="pageLabel" class="subtitle">1 / 3</span><button id="nextPage">次へ →</button></div></div></section>
 <section class="panel"><div class="panel-head"><strong id="howtoTitle">遊び方</strong></div><div class="panel-body"><ol style="padding-left:19px;margin:0;color:var(--muted)"><li id="howto1">空洞に接しているブロックをタップすると、その1マスだけ採掘。</li><li id="howto2">採掘ONならタップした1マスだけ回収。</li><li id="howto3">設置OFFなら選択した資源を1マスずつ配置。</li><li id="howto4">掘るほど新しい資源層に到達します。</li></ol></div></section>
</aside>
</main>
<div class="drawer" id="drawer"><div class="drawer-card"><div class="drawer-head"><strong id="inventoryTitle" style="font-size:18px">インベントリ</strong><button id="closeInventory">閉じる ✕</button></div><div class="inventory-tabs" id="tabs"><button class="tab active" data-tab="all">すべて</button><button class="tab" data-tab="terrain">地層</button><button class="tab" data-tab="rock">岩石</button><button class="tab" data-tab="metal">金属</button><button class="tab" data-tab="gem">宝石</button><button class="tab" data-tab="fuel">燃料</button><button class="tab" data-tab="product">製品</button></div><div class="panel-body" style="padding:12px 0"><div class="resource-list" id="inventoryResources"></div><div class="footer-note" id="inventoryNote">設置モードでは、ここで選択したブロックをフィールドに配置できます。</div></div></div></div>
<div class="toast" id="toast"></div>
<script>
(() => {
"use strict";
let TYPES = [];
const W=300,H=300,EMPTY=null;
let world=[],baseWorld=[],inventory={},mode="mine",selected="dirt",mined=0,page=0,invTab="all",visibility=[];
let conveyors={},furnaces={},toolMode="none",distributeMode=false,beltDirection="right",language="ja",LANG={},MACHINE_TYPES=[];
const REVEAL_RADIUS=5;
function updateVisibility(){
 visibility=Array.from({length:H},()=>Array(W).fill(99));
 const queue=new Int32Array(W*H),dist=new Int8Array(W*H);dist.fill(99);let head=0,tail=0;
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)if(world[y][x]===EMPTY){const i=y*W+x;dist[i]=0;queue[tail++]=i;}
 while(head<tail){const i=queue[head++],x=i%W,y=(i/W)|0,d=dist[i];if(d>=REVEAL_RADIUS)continue;
  for(const [nx,ny] of [[x+1,y],[x-1,y],[x,y+1],[x,y-1]])if(nx>=0&&ny>=0&&nx<W&&ny<H){const ni=ny*W+nx;if(dist[ni]>d+1){dist[ni]=d+1;queue[tail++]=ni;}}
 }
 for(let y=0;y<H;y++)for(let x=0;x<W;x++)visibility[y][x]=dist[y*W+x];
}
const $=id=>document.getElementById(id);
const typeById=id=>TYPES.find(t=>t.id===id);
// Seeded 2D gradient Perlin noise and fractal Brownian motion.
let worldSeed=0;
const SAVE_KEY="stoneblock-world-v1";
const INVENTORY_KEY="stoneblock-inventory-v1";
function saveInventory(){try{localStorage.setItem(INVENTORY_KEY,JSON.stringify(inventory));return true;}catch(e){toast("インベントリを保存できませんでした");return false;}}
function loadInventory(){try{const raw=localStorage.getItem(INVENTORY_KEY);const saved=raw?JSON.parse(raw):null;inventory={};for(const t of TYPES)inventory[t.id]=Number(saved?.[t.id])||0;}catch(e){inventory={};for(const t of TYPES)inventory[t.id]=0;}}
function saveWorld(show=true){try{const wrap=document.querySelector(".world-wrap"),changes=[];for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=y*W+x;if(world[y][x]!==baseWorld[y][x])changes.push([i,world[y][x]]);}const data={version:5,seed:worldSeed,changes,mined,selected,mode,conveyors,furnaces,scrollLeft:wrap.scrollLeft,scrollTop:wrap.scrollTop};localStorage.setItem(SAVE_KEY,JSON.stringify(data));if(show)toast("ワールドを保存しました（変更箇所 "+changes.length+"）");return true;}catch(e){toast("保存できませんでした（容量・ブラウザ設定を確認）");return false;}}
function loadWorld(show=true){try{
 const raw=localStorage.getItem(SAVE_KEY);if(!raw){if(show)toast("保存データがありません");return false;}
 const d=JSON.parse(raw);if(![1,2,3,4,5].includes(d.version))throw new Error("invalid save");
 worldSeed=Number.isSafeInteger(d.seed)?d.seed:0;baseWorld=generateBase();world=baseWorld.map(row=>row.slice());
 if(d.version===1){
  if(!Array.isArray(d.world)||d.world.length!==H||d.world.some(row=>!Array.isArray(row)||row.length!==W))throw new Error("invalid legacy save");
  world=d.world;
 }else{
  if(!Array.isArray(d.changes))throw new Error("invalid changes");
  for(const change of d.changes){if(!Array.isArray(change)||change.length!==2)continue;const i=change[0],id=change[1];if(!Number.isInteger(i)||i<0||i>=W*H||(id!==null&&!typeById(id)))continue;world[Math.floor(i/W)][i%W]=id;}
 }
 if(d.version<4&&!localStorage.getItem(INVENTORY_KEY)){inventory={};for(const t of TYPES)inventory[t.id]=Number(d.inventory?.[t.id])||0;saveInventory();}
 mined=Number(d.mined)||0;selected=typeById(d.selected)?d.selected:"dirt";mode=d.mode==="place"?"place":"mine";conveyors=d.version>=5&&d.conveyors&&typeof d.conveyors==="object"?d.conveyors:{};furnaces=d.version>=5&&d.furnaces&&typeof d.furnaces==="object"?d.furnaces:{};
 updateVisibility();setMode(mode);render();$("seedInput").value=String(worldSeed);
 const wrap=document.querySelector(".world-wrap");wrap.scrollLeft=Number(d.scrollLeft)||0;wrap.scrollTop=Number(d.scrollTop)||0;
 drawWorld();drawMinimap();if(show)toast("保存したワールドを読み込みました");return true;
 }catch(e){if(show)toast("保存データを読み込めませんでした");return false;}}
function hash2(ix,iy){
 let h=(Math.imul(ix,374761393)+Math.imul(iy,668265263)+worldSeed)|0;
 h=Math.imul(h^(h>>>13),1274126177);return ((h^(h>>>16))>>>0)/4294967295;
}
function fade(t){return t*t*t*(t*(t*6-15)+10);}
function perlin(x,y){
 const x0=Math.floor(x),y0=Math.floor(y),xf=x-x0,yf=y-y0;
 const dot=(ix,iy,dx,dy)=>{const a=hash2(ix,iy)*Math.PI*2;return Math.cos(a)*dx+Math.sin(a)*dy;};
 const u=fade(xf),v=fade(yf);
 const a=dot(x0,y0,xf,yf),b=dot(x0+1,y0,xf-1,yf);
 const c=dot(x0,y0+1,xf,yf-1),d=dot(x0+1,y0+1,xf-1,yf-1);
 const ab=a+(b-a)*u,cd=c+(d-c)*u;
 return (ab+(cd-ab)*v)*1.4142;
}
function fbm(x,y,octaves=4){
 let sum=0,amp=.5,freq=1,norm=0;
 for(let i=0;i<octaves;i++){sum+=perlin(x*freq,y*freq)*amp;norm+=amp;amp*=.5;freq*=2;}
 return sum/norm;
}
function weightedType(depth,x,y){
 const broad=fbm(x*.018,y*.018,3),medium=fbm(x*.055+41,y*.055-17,3);
 const detail=fbm(x*.13-9,y*.13+23,2),vertical=y/H;
 if(y<18+Math.floor((fbm(x*.035,7)*.5+.5)*8)){
  if(medium>.30&&detail>.00)return "clay";
  if(medium<-.34&&detail<-.00)return "sand";
  return "dirt";
 }
 // Carve connected cave systems before placing mineral deposits.
 const caveWarpX=fbm(x*.022+137,y*.022-51,3),caveWarpY=fbm(x*.022-73,y*.022+119,3);
 const cave=fbm((x+caveWarpX*8)*.042,(y+caveWarpY*8)*.042,3);
 if(y>28&&cave>.64&&detail<.58)return EMPTY;
 // Separate low-frequency fields make deposits form connected, irregular veins.
 const copperVein=fbm(x*.072+83,y*.072-29,3);
 const ironVein=fbm(x*.078-151,y*.078+67,3);
 const preciousVein=fbm(x*.105+211,y*.105-173,3);
 const gemVein=fbm(x*.145-307,y*.145+229,3);
 const local=fbm(x*.19+17,y*.19-91,2);
 const coalVein=fbm(x*.085+319,y*.085-211,3),peatVein=fbm(x*.12-417,y*.12+83,3);
 if(y>20&&y<155&&coalVein>.49&&detail>-.30)return "coal";
 if(y>18&&y<75&&peatVein<-.62&&detail<.30)return "peat";
 if(y>34&&copperVein>.43&&local>-.24)return "copper";
 if(y>42&&ironVein<-.43&&local<.25)return "iron";
 if(vertical>.25&&preciousVein>.57&&local>-.08)return "gold";
 if(vertical>.30&&preciousVein<-.61&&local<.12)return "silver";
 if(vertical>.52&&broad<-.35&&preciousVein>.35&&local>.08)return "platinum";
 if(vertical>.38&&gemVein>.64&&local>.12){
  const gems=["diamond","ruby","emerald","amethyst","sapphire","topaz","aquamarine"];
  return gems[Math.floor(hash2(x+991,y-337)*gems.length)];
 }
 // Rock strata are broad regions; stone remains the dominant host rock.
 if(broad>.48&&medium>.05)return "granite";
 if(broad<-.48&&medium<-.02)return "basalt";
 if(medium>.48)return "diorite";
 if(medium<-.48)return "andesite";
 return "stone";
}
function generateBase(){
 const cx=Math.floor(W/2),cy=Math.floor(H/2);
 const map=Array.from({length:H},(_,y)=>Array.from({length:W},(_,x)=>weightedType(Math.max(Math.abs(x-cx),Math.abs(y-cy)),x,y)));
 for(let y=cy-2;y<=cy+2;y++)for(let x=cx-2;x<=cx+2;x++)map[y][x]=EMPTY;
 return map;
}
function generate(seed=null){
 worldSeed=seed===null?Math.floor(Math.random()*2147483647):seed;
 baseWorld=generateBase();world=baseWorld.map(row=>row.slice());
 conveyors={};furnaces={};mined=0;updateVisibility();render();
 $("seedInput").value=String(worldSeed);
}
function isAir(x,y){return x<0||y<0||x>=W||y>=H||world[y][x]===EMPTY;}
function adjacentToSolid(x,y){return [[1,0],[-1,0],[0,1],[0,-1]].some(([dx,dy])=>x+dx>=0&&y+dy>=0&&x+dx<W&&y+dy<H&&world[y+dy][x+dx]!==EMPTY);}
function exposed(x,y){if(isAir(x,y))return false;return isAir(x+1,y)||isAir(x-1,y)||isAir(x,y+1)||isAir(x,y-1);}
function drawWorld(){
 const canvas=$("world"),wrap=document.querySelector(".world-wrap"),ctx=canvas.getContext("2d");
 const dpr=Math.min(window.devicePixelRatio||1,2),vw=wrap.clientWidth,vh=wrap.clientHeight;
 canvas.width=Math.floor(vw*dpr);canvas.height=Math.floor(vh*dpr);canvas.style.width=vw+"px";canvas.style.height=vh+"px";
 ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#090d0e";ctx.fillRect(0,0,vw,vh);
 const cell=36,sx=wrap.scrollLeft,sy=wrap.scrollTop;
 const x0=Math.max(0,Math.floor(sx/cell)),y0=Math.max(0,Math.floor(sy/cell));
 const x1=Math.min(W,Math.ceil((sx+vw)/cell)),y1=Math.min(H,Math.ceil((sy+vh)/cell));
 for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){
  const id=world[y][x],px=x*cell-sx,py=y*cell-sy,distance=visibility[y]?.[x]??99;
  if(distance>REVEAL_RADIUS||id===EMPTY)continue;
  const t=typeById(id),darkness=Math.max(0,Math.min(.96,(distance-1)/5));ctx.globalAlpha=1-darkness;ctx.fillStyle=t.color;ctx.fillRect(px,py,cell,cell);
  // Fine, irregular mineral/soil grain: subtle pixel clusters, no tile outlines.
  let seed=((x*374761393)^(y*668265263)^(id.length*2246822519))>>>0;
  const rand=()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296;};
  for(let k=0;k<13;k++){
   const shade=rand()>.5?255:0,alpha=.035+rand()*.09;
   ctx.fillStyle=shade?"rgba(255,255,255,"+alpha+")":"rgba(0,0,0,"+alpha+")";
   const size=2+Math.floor(rand()*5);ctx.fillRect(px+Math.floor(rand()*(cell-size)),py+Math.floor(rand()*(cell-size)),size,size);
  }
  if(t.group==="metal"||t.group==="gem"){
   for(let k=0;k<5;k++){const ox=4+rand()*28,oy=4+rand()*28;ctx.fillStyle=t.color;ctx.globalAlpha=.65+rand()*.3;ctx.fillRect(px+ox,py+oy,2+rand()*4,2+rand()*4);}
   ctx.globalAlpha=1;
  }
  ctx.globalAlpha=1;
 }
 drawMachines(ctx,sx,sy,cell,x0,y0,x1,y1);
}
function drawMachines(ctx,sx,sy,cell,x0,y0,x1,y1){
 for(let y=y0;y<y1;y++)for(let x=x0;x<x1;x++){const key=String(y*W+x),px=x*cell-sx,py=y*cell-sy;
  if(conveyors[key]){const b=conveyors[key];ctx.fillStyle="#394744";ctx.fillRect(px+4,py+4,cell-8,cell-8);ctx.strokeStyle="#b6c5bd";ctx.lineWidth=2;ctx.beginPath();
   if(b.dir==="right"){ctx.moveTo(px+7,py+18);ctx.lineTo(px+29,py+18);ctx.moveTo(px+23,py+12);ctx.lineTo(px+29,py+18);ctx.lineTo(px+23,py+24);}
   if(b.dir==="left"){ctx.moveTo(px+29,py+18);ctx.lineTo(px+7,py+18);ctx.moveTo(px+13,py+12);ctx.lineTo(px+7,py+18);ctx.lineTo(px+13,py+24);}
   if(b.dir==="down"){ctx.moveTo(px+18,py+7);ctx.lineTo(px+18,py+29);ctx.moveTo(px+12,py+23);ctx.lineTo(px+18,py+29);ctx.lineTo(px+24,py+23);}
   if(b.dir==="up"){ctx.moveTo(px+18,py+29);ctx.lineTo(px+18,py+7);ctx.moveTo(px+12,py+13);ctx.lineTo(px+18,py+7);ctx.lineTo(px+24,py+13);}ctx.stroke();
   for(let lane=0;lane<2;lane++)for(let slot=0;slot<4;slot++){const item=b.lanes?.[lane]?.[slot];if(!item)continue;const along=slot*6+5,side=lane===0?11:23;let ix=px+along,iy=py+side;if(b.dir==="left")ix=px+31-along;if(b.dir==="down"){ix=px+side;iy=py+along;}if(b.dir==="up"){ix=px+side;iy=py+31-along;}ctx.fillStyle=typeById(item)?.color||"#fff";ctx.fillRect(ix-2,iy-2,4,4);}
  }
  if(furnaces[key]){ctx.fillStyle="#704a38";ctx.fillRect(px+3,py+3,cell-6,cell-6);ctx.fillStyle="#e68a48";ctx.fillRect(px+10,py+10,cell-20,cell-20);ctx.fillStyle="#ffe0a3";ctx.fillRect(px+14,py+14,8,8);}
 }
}
function nextBeltCell(x,y,d){if(d==="right")x++;else if(d==="left")x--;else if(d==="up")y--;else y++;return x<0||y<0||x>=W||y>=H?null:String(y*W+x);}
function acceptAtFurnace(key,item){const f=furnaces[key];if(!f)return false;if(item==="coal"||item==="peat")f.fuel=(f.fuel||0)+(item==="coal"?8:4);else if(item==="iron"||item==="copper")f.ore=(f.ore||[]).concat(item);while((f.fuel||0)>0&&(f.ore||[]).length){const ore=f.ore.shift();f.fuel--;const out=ore+"_ingot";inventory[out]=(inventory[out]||0)+1;}return true;}
function conveyorTick(){let changed=false;for(const key of Object.keys(conveyors)){const b=conveyors[key],i=Number(key),x=i%W,y=Math.floor(i/W);if(!Array.isArray(b.lanes))b.lanes=[Array(4).fill(null),Array(4).fill(null)];for(let lane=0;lane<2;lane++){const a=b.lanes[lane];for(let s=3;s>=0;s--){if(!a[s])continue;if(s<3){if(!a[s+1]){a[s+1]=a[s];a[s]=null;changed=true;}}else{const next=nextBeltCell(x,y,b.dir);if(next&&conveyors[next]&&conveyors[next].dir===b.dir){const dest=conveyors[next];if(!Array.isArray(dest.lanes))dest.lanes=[Array(4).fill(null),Array(4).fill(null)];if(!dest.lanes[lane][0]){dest.lanes[lane][0]=a[s];a[s]=null;changed=true;}}else if(next&&furnaces[next]&&acceptAtFurnace(next,a[s])){a[s]=null;changed=true;}}}}}if(changed){render();saveWorld(false);saveInventory();}}
function drawMinimap(){const c=$("minimap"),ctx=c.getContext("2d"),sx=c.width/W,sy=c.height/H;ctx.fillStyle="#090d0e";ctx.fillRect(0,0,c.width,c.height);for(let y=0;y<H;y++)for(let x=0;x<W;x++){const d=visibility[y]?.[x]??99;if(d>REVEAL_RADIUS||world[y][x]===EMPTY)continue;ctx.globalAlpha=1-Math.max(0,(d-1)/5);ctx.fillStyle=typeById(world[y][x]).color;ctx.fillRect(x*sx,y*sy,Math.ceil(sx),Math.ceil(sy));}ctx.globalAlpha=1;const wrap=document.querySelector(".world-wrap"),cell=36;ctx.strokeStyle="#f0f3f2";ctx.lineWidth=1;ctx.strokeRect(wrap.scrollLeft/(W*cell)*c.width,wrap.scrollTop/(H*cell)*c.height,wrap.clientWidth/(W*cell)*c.width,wrap.clientHeight/(H*cell)*c.height);}
function render(){
 drawWorld();drawMinimap();
 $("mined").textContent=mined;const total=Object.values(inventory).reduce((a,b)=>a+b,0);$("total").textContent=total;$("totalMobile").textContent=total;
 renderResources();
}
function interact(x,y){const key=String(y*W+x);
 if(toolMode==="conveyor"){if(!isAir(x,y)){toast("コンベアは空気マスに設置してください");return;}conveyors[key]={dir:beltDirection,lanes:[Array(4).fill(null),Array(4).fill(null)]};toolMode="none";render();saveWorld(false);toast("コンベアを設置しました");return;}
 if(toolMode==="furnace"){if(!isAir(x,y)){toast("かまどは空気マスに設置してください");return;}furnaces[key]={fuel:0,ore:[]};toolMode="none";render();saveWorld(false);toast("かまどを設置しました");return;}
 if(distributeMode&&conveyors[key]){const b=conveyors[key];if(inventory[selected]<1){toast("選択中のアイテムがありません");return;}for(let lane=0;lane<2;lane++){if(!b.lanes[lane][0]){b.lanes[lane][0]=selected;inventory[selected]--;render();saveInventory();saveWorld(false);return;}}toast("コンベアの入口がいっぱいです");return;}
 if(furnaces[key]){const f=furnaces[key];toast("かまど：燃料 "+(f.fuel||0)+" / 鉱石 "+(f.ore||[]).length);return;}
 if(mode==="mine"){
  if(!exposed(x,y)){toast("このブロックはまだ空気に接していません");return;}
  const id=world[y][x];
  if(id===EMPTY)return;
  world[y][x]=EMPTY;inventory[id]=(inventory[id]||0)+1;mined++;updateVisibility();
  render();saveInventory();saveWorld(false);toast("1マス採掘しました");
 }else{
  if(!isAir(x,y)||!adjacentToSolid(x,y)){toast("ブロックに接している空気マスを選んでください");return;}
  const id=selected,t=typeById(id);
  if(inventory[id]<1){toast(t.name+"が足りません（所持 0 個）");return;}
  world[y][x]=id;inventory[id]--;updateVisibility();render();saveInventory();saveWorld(false);toast(t.name+"を1マス設置しました");
 }
}
function resourceRow(t){
 const row=document.createElement("div");row.className="resource";row.innerHTML=`<span class="swatch" style="background:${t.color}"></span><span class="name">${language==="en"?(t.name_en||t.name):t.name}</span><b class="count">${inventory[t.id]||0}</b>`;
 row.addEventListener("click",()=>{selected=t.id;document.querySelectorAll(".resource").forEach(e=>e.style.outline="");row.style.outline="1px solid #a6b5b2";$("hint").textContent="設置対象："+t.name;saveWorld(false);});return row;
}
function renderResources(){
 const start=page*7,items=TYPES.slice(start,start+7);$("quickResources").innerHTML="";items.forEach(t=>$("quickResources").appendChild(resourceRow(t)));
 $("pageLabel").textContent=(page+1)+" / "+Math.ceil(TYPES.length/7);
 $("prevPage").disabled=page===0;$("nextPage").disabled=(page+1)*7>=TYPES.length;
 $("inventoryResources").innerHTML="";
 TYPES.filter(t=>invTab==="all"||t.group===invTab).forEach(t=>$("inventoryResources").appendChild(resourceRow(t)));
}
function setMode(next){
 mode=next;const toggle=$("mineToggle");toggle.textContent=mode==="mine"?"⛏ 採掘 ON":"▦ 採掘 OFF（設置）";toggle.classList.toggle("active",mode==="mine");toggle.classList.toggle("place",mode==="place");
 $("hint").textContent=mode==="mine"?"空気に接しているブロックをタップして採掘":"採掘OFF：インベントリからブロックを選び、空気マスをタップして1マス設置";render();
}
function tr(k){return LANG[k]||k;}
function applyLanguage(){$("language").value=language;$("mineToggle").textContent="⛏ "+tr(mode==="mine"?"mine":"place");$("buildConveyor").textContent=tr("conveyorBuild");$("buildFurnace").textContent=tr("furnace");$("beltDirection").previousElementSibling.textContent=tr("direction")+" ";$("distribute").textContent=language==="en"?"Distribute: "+(distributeMode?"ON":"OFF"):"配る："+(distributeMode?"ON":"OFF");$("randomWorld").textContent=tr("random");$("applySeed").textContent=tr("applySeed");$("openInventory").textContent=tr("inventory");$("openInventoryMobile").textContent=tr("inventory");$("closeInventory").textContent=tr("close")+" ✕";$("tabs").querySelectorAll("[data-tab]").forEach(b=>b.textContent=tr(b.dataset.tab));$("brandSubtitle").textContent=tr("brandSubtitle");$("fieldTitle").textContent=tr("fieldTitle");$("resourceTitle").textContent=tr("resourceTitle");$("howtoTitle").textContent=tr("howtoTitle");$("inventoryTitle").textContent=tr("inventory");$("quickNote").textContent=tr("quickNote");$("inventoryNote").textContent=tr("inventoryNote");for(let i=1;i<=4;i++)$("howto"+i).textContent=tr("howto"+i);$("hint").textContent=mode==="mine"?tr("hintMine"):mode==="place"?tr("hintPlace"):toolMode==="conveyor"?tr("conveyorHint"):tr("distributeHint");}
function toast(s){const e=$("toast");e.textContent=s;e.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>e.classList.remove("show"),1700);}
$("mineToggle").onclick=()=>{setMode(mode==="mine"?"place":"mine");saveWorld(false);};
$("buildConveyor").onclick=()=>{toolMode=toolMode==="conveyor"?"none":"conveyor";distributeMode=false;applyLanguage();toast(toolMode==="conveyor"?"コンベアを置くマスをクリック":"コンベア設置を終了");};
$("buildFurnace").onclick=()=>{toolMode=toolMode==="furnace"?"none":"furnace";distributeMode=false;applyLanguage();toast(toolMode==="furnace"?"かまどを置くマスをクリック":"かまど設置を終了");};
$("distribute").onclick=()=>{distributeMode=!distributeMode;toolMode="none";applyLanguage();toast(distributeMode?"配るモード ON：コンベアをクリック":"配るモード OFF");saveWorld(false);};
$("beltDirection").onchange=e=>beltDirection=e.target.value;
$("language").onchange=async e=>{language=e.target.value;try{const rr=await fetch("data/lang/"+language+".json");LANG=await rr.json();localStorage.setItem("stoneblock-language",language);applyLanguage();renderResources();}catch(err){toast("Language file could not be loaded");}};
$("prevPage").onclick=()=>{page=Math.max(0,page-1);renderResources();};$("nextPage").onclick=()=>{page=Math.min(Math.ceil(TYPES.length/7)-1,page+1);renderResources();};
$("openInventory").onclick=$("openInventoryMobile").onclick=()=>{$("drawer").classList.add("open");};
$("closeInventory").onclick=()=> $("drawer").classList.remove("open");
$("drawer").addEventListener("click",e=>{if(e.target===$("drawer"))$("drawer").classList.remove("open");});
$("tabs").addEventListener("click",e=>{const b=e.target.closest("[data-tab]");if(!b)return;invTab=b.dataset.tab;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t===b));renderResources();});
$("randomWorld").onclick=()=>{if(confirm("ランダムなシード値で新しい地形を生成しますか？インベントリは保持されます。")){generate();saveWorld(false);saveInventory();toast("新しいワールド：seed "+worldSeed);}};
$("applySeed").onclick=()=>{const raw=$("seedInput").value.trim(),seed=Number(raw);if(raw===""||!Number.isSafeInteger(seed)){toast("シード値は整数で入力してください");return;}if(confirm("シード "+seed+" で新しい地形を生成しますか？インベントリは保持されます。")){generate(seed);saveWorld(false);saveInventory();toast("指定シードで生成しました："+worldSeed);}};
async function boot(){
const br=await fetch("data/blocks.json");if(!br.ok)throw Error("blocks.json load failed");TYPES=await br.json();const mr=await fetch("data/machines.json");if(!mr.ok)throw Error("machines.json load failed");MACHINE_TYPES=await mr.json();language=localStorage.getItem("stoneblock-language")||"ja";const lr=await fetch("data/lang/"+language+".json");LANG=await lr.json();loadInventory();
 const hasSavedWorld=loadWorld(false);applyLanguage();if(!hasSavedWorld){generate();saveWorld(false);}
 const wrap=document.querySelector(".world-wrap");
 if(!hasSavedWorld){wrap.scrollLeft=(wrap.scrollWidth-wrap.clientWidth)/2;wrap.scrollTop=(wrap.scrollHeight-wrap.clientHeight)/2;}
 let saveScrollTimer;wrap.addEventListener("scroll",()=>{drawWorld();drawMinimap();clearTimeout(saveScrollTimer);saveScrollTimer=setTimeout(()=>saveWorld(false),500);},{passive:true});
 $("minimap").addEventListener("click",e=>{const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*W*36,y=(e.clientY-r.top)/r.height*H*36;wrap.scrollLeft=Math.max(0,x-wrap.clientWidth/2);wrap.scrollTop=Math.max(0,y-wrap.clientHeight/2);drawWorld();drawMinimap();});
 $("world").addEventListener("click",e=>{
  if(e.target!==$("world"))return;
  const rect=wrap.getBoundingClientRect(),x=Math.floor((e.clientX-rect.left+wrap.scrollLeft)/36),y=Math.floor((e.clientY-rect.top+wrap.scrollTop)/36);
  if(x>=0&&y>=0&&x<W&&y<H){if(mode==="mine"){if(exposed(x,y))interact(x,y);}else if(isAir(x,y)&&adjacentToSolid(x,y))interact(x,y);}
 });
 window.addEventListener("resize",drawWorld);window.addEventListener("pagehide",()=>saveWorld(false));drawWorld();setInterval(conveyorTick,350);
}
boot().catch(error=>{console.error(error);toast("ゲームデータを読み込めませんでした");});
})();
</script>
</body>
</html>
